<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1942" width="2760" height="1942" font-family="'DejaVu Sans', Verdana, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Mạch thu IR (RX) — ESP32 DevKit V1: module VS1838B, VCC→3V3, OUT→GPIO15, GND→GND (lắp tạm để xác minh giao thức)</title>
<rect width="2760" height="1942" fill="#ffffff"/>
<!-- Dây điện: xanh dương = 3V3, đen = GND, xanh lá = GPIO15 -->
<text x="1380.0" y="130" font-size="72" fill="#2c2c2a" text-anchor="middle" font-weight="bold">Mạch thu IR (RX) hoàn chỉnh — lắp tạm để xác minh giao thức</text>
<rect id="esp32" x="160" y="330" width="790" height="1160" rx="60" fill="#f1efe8" stroke="#5f5e5a" stroke-width="3"/>
<text x="555" y="435" font-size="58" fill="#2c2c2a" text-anchor="middle">ESP32 DevKit V1</text>
<rect id="pin_3v3" x="220" y="540" width="670" height="130" rx="18" fill="#e6f1fb" stroke="#185fa5" stroke-width="3"/>
<text x="555" y="623" font-size="50" fill="#042c53" text-anchor="middle">3V3</text>
<rect id="pin_gpio15" x="220" y="940" width="670" height="130" rx="18" fill="#eaf3de" stroke="#3b6d11" stroke-width="3"/>
<text x="555" y="1023" font-size="50" fill="#173404" text-anchor="middle">GPIO15 ← IR RX</text>
<rect id="pin_gnd" x="220" y="1320" width="670" height="130" rx="18" fill="#f1efe8" stroke="#5f5e5a" stroke-width="3"/>
<text x="555" y="1403" font-size="50" fill="#2c2c2a" text-anchor="middle">GND</text>
<rect id="module" x="1350" y="690" width="930" height="410" rx="40" fill="#eaf3de" stroke="#3b6d11" stroke-width="3"/>
<text x="1815" y="785" font-size="58" fill="#173404" text-anchor="middle">Module thu hồng ngoại</text>
<text x="1815" y="860" font-size="50" fill="#27500a" text-anchor="middle">VS1838B</text>
<text x="1815" y="938" font-size="50" fill="#27500a" text-anchor="middle">chân: VCC · GND · OUT</text>
<text x="1815" y="1012" font-size="42" fill="#27500a" text-anchor="middle">(gỡ ra sau khi xác minh xong)</text>
<polyline id="w_vcc" points="890,605 1130,605 1130,765 1348,765" fill="none" stroke="#185fa5" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1314.4,747.2 1348,765 1314.4,782.8" fill="none" stroke="#185fa5" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="890" cy="605" r="14" fill="#185fa5"/>
<text x="1010" y="690" font-size="42" fill="#042c53" text-anchor="middle">VCC</text>
<polyline id="w_out" points="1350,870 1060,870 1060,1005 898,1005" fill="none" stroke="#3b6d11" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="931.6,1022.8 898,1005 931.6,987.2" fill="none" stroke="#3b6d11" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="890" cy="1005" r="14" fill="#3b6d11"/>
<text x="1205" y="838" font-size="42" fill="#173404" text-anchor="middle">OUT</text>
<polyline id="w_gnd" points="1350,975 1220,975 1220,1385 898,1385" fill="none" stroke="#2c2c2a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="931.6,1402.8 898,1385 931.6,1367.2" fill="none" stroke="#2c2c2a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="890" cy="1385" r="14" fill="#2c2c2a"/>
<text x="1059" y="1345" font-size="42" fill="#2c2c2a" text-anchor="middle">GND</text>
<rect id="legend" x="160" y="1590" width="2440" height="252" rx="40" fill="#f1efe8" stroke="#5f5e5a" stroke-width="3"/>
<text x="215" y="1676" font-size="40" fill="#2c2c2a" text-anchor="start">Xanh dương = 3V3 · Đen = GND · Xanh lá = GPIO15 (tín hiệu thu).</text>
<text x="215" y="1740" font-size="40" fill="#2c2c2a" text-anchor="start">⚠ Thứ tự chân VS1838B không cố định giữa các lô — kiểm tra datasheet/chữ in trên board trước khi cấp nguồn.</text>
<text x="215" y="1804" font-size="40" fill="#5f5e5a" text-anchor="start">GND này phải nối chung với GND của mạch phát IR khi ghép chung một mạch.</text>
