<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2760 1878" width="2760" height="1878" font-family="'DejaVu Sans', Verdana, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Mạch phát IR (TX) — ESP32 DevKit V1: GPIO4 → R1 1kΩ → 2N2222 → R2 27Ω → 2 LED IR333-C nối tiếp</title>
<rect width="2760" height="1878" fill="#ffffff"/>
<!-- Dây điện: đỏ = 5V/VIN, đen = GND, cam = GPIO4 -->
<text x="1380.0" y="130" font-size="72" fill="#2c2c2a" text-anchor="middle" font-weight="bold">Mạch phát IR (TX) — bản hoàn chỉnh</text>
