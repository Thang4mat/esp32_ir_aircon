<text x="555" y="1403" font-size="50" fill="#2c2c2a" text-anchor="middle">GND</text>
<polyline id="w_5v" points="890,605 1010,605 1010,470 2635,470 2635,640" fill="none" stroke="#d0332c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1820" y="432" font-size="44" fill="#712b13" text-anchor="middle">nguồn 5V cho LED</text>
<circle cx="890" cy="605" r="14" fill="#d0332c"/>
<polyline id="w_base_a" points="890,1005 990,1005" fill="none" stroke="#ba7517" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<rect id="r1" x="990" y="955" width="240" height="100" rx="14" fill="#faece7" stroke="#993c1d" stroke-width="3"/>
