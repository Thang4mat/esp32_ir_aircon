<circle cx="890" cy="1385" r="14" fill="#2c2c2a"/>
<text x="1250" y="1452" font-size="40" fill="#5f5e5a" text-anchor="middle">emitter → GND</text>
<rect id="legend" x="160" y="1590" width="2440" height="188" rx="40" fill="#f1efe8" stroke="#5f5e5a" stroke-width="3"/>
<text x="215" y="1676" font-size="40" fill="#2c2c2a" text-anchor="start">Đỏ = 5V/VIN · Đen = GND · Cam = GPIO4 (tín hiệu điều khiển transistor).</text>
<text x="215" y="1740" font-size="40" fill="#2c2c2a" text-anchor="start">Linh kiện: R1=1kΩ, R2=27Ω (2W), Q1=2N2222, 2× LED IR333-C nối tiếp. GND nối chung với mạch thu IR.</text>
